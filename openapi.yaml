openapi: 3.0.3

info:
  title: Bank of Makati CMS API
  version: 1.0.0

servers:
  - url: http://127.0.0.1:8000

paths:
  /api/v1/login:
    post:
      summary: User login
      description: Authenticate a user and generate an access token.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: john
                password:
                  type: string
                  format: password
                  example: password

      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login successful.
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: abc123