services:
  - type: web
    name: bmi-cms-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: BMI_MCMS
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        fromService:
          type: web
          name: bmi-cms-api
          property: url
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      # Render PostgreSQL connection, read by the 'pgsql' connection in config/database.php.
      - key: DB_HOST
        fromDatabase:
          name: mobile-cms-api-database
          property: host
      - key: DB_PORT
        fromDatabase:
          name: mobile-cms-api-database
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: mobile-cms-api-database
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: mobile-cms-api-database
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: mobile-cms-api-database
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync

databases:
  # Existing Render PostgreSQL instance (service ID dpg-db690s2jnfac73csrfcg-a).
  # The name must match the dashboard name, otherwise a Blueprint sync creates a new database.
  - name: mobile-cms-api-database
    databaseName: mobile_cms_api
    user: mobile_cms_api_user
    plan: free
    postgresMajorVersion: "16"
